{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Login · Garment ERP{% endblock %}

{% block content %}
<div class="erp-login-wrap">
  <div class="erp-login-card">
    <div class="text-center mb-4">
      <i class="bi bi-boxes" style="font-size:2.2rem; color:#0f8b8d;"></i>
      <h4 class="mt-2 mb-0 fw-bold" style="color:#10233f;">GARMENT ERP</h4>
      <small class="text-muted">Buying / Trading House Operations</small>
    </div>
    {% if form.errors %}
      <div class="alert alert-danger py-2">Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-erp-primary w-100 mt-2">
        <i class="bi bi-box-arrow-in-right"></i> Sign in
      </button>
    </form>
  </div>
</div>
{% endblock %}
