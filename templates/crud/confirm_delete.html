{% extends "base.html" %}
{% block title %}Delete · Garment ERP{% endblock %}

{% block content %}
<div class="erp-page-header">
  <h1><i class="bi bi-exclamation-triangle text-danger"></i> Confirm Delete</h1>
</div>

<div class="erp-card p-4" style="max-width: 600px;">
  <p>Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, delete</button>
    <a href="{% if url_names %}{% url url_names.list %}{% else %}javascript:history.back(){% endif %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
