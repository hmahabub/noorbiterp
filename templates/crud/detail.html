{% extends "base.html" %}
{% load erp_extras %}
{% block title %}{{ title }} · Garment ERP{% endblock %}

{% block content %}
<div class="erp-page-header">
  <h1><i class="bi bi-info-circle"></i> {{ title|slice:":-1" }} Details</h1>
  <div>
    <a href="{% url url_names.update object.pk %}" class="btn btn-outline-primary">
      <i class="bi bi-pencil"></i> Edit
    </a>
    <a href="{% url url_names.list %}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Back to list
    </a>
  </div>
</div>

<div class="row g-4">
  <div class="col-lg-8">
    <div class="erp-card p-4">
      <dl class="row mb-0">
        {% for col in detail_columns %}
        <dt class="col-sm-4 text-muted">{{ col.label }}</dt>
        <dd class="col-sm-8">{{ object|get_attr:col.name|default:"—" }}</dd>
        {% endfor %}
      </dl>
    </div>
  </div>


</div>
{% endblock %}
