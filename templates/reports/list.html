{% extends "base.html" %}
{% block title %}Reports · Garment ERP{% endblock %}

{% block content %}
<div class="erp-page-header">
  <h1><i class="bi bi-file-earmark-bar-graph"></i> Monthly Reports</h1>
</div>

<div class="row g-3">
  {% for report in reports %}
  <div class="col-md-4">
    <a href="{% url 'reports:detail' report.slug %}" class="text-decoration-none">
      <div class="erp-card p-3 h-100">
        <i class="bi bi-file-earmark-text" style="font-size:1.3rem; color:#0f8b8d;"></i>
        <div class="fw-semibold mt-2" style="color:#10233f;">{{ report.name }}</div>
        <div class="text-muted small">View live snapshot</div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
